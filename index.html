<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Планета</title>

  <!-- Підключаємо model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
    button {
      background: #ff3c00;
      border: none;
      color: #fff;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer
    src="earthmars.glb"
    ios-src="earthmars.usdz"
    alt="Планета"
    ar
    ar-modes="scene-viewer quick-look webxr"
    auto-rotate
    camera-controls
    exposure="1"
    shadow-intensity="1">
      <button slot="ar-button">🔭 Подивитись у AR</button>
  </model-viewer>

</body>
</html>
